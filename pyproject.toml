[project]
name = "multi-agent-code-reviewer"
version = "0.1.0"
description = "A LangGraph code reviewer built around a verification gate, with an eval harness that measures whether any of it works."
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2",
    "langchain-anthropic>=1.7",
    "langchain-google-genai>=4.4",
    "langsmith>=0.12",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[project.scripts]
review = "reviewer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "S", "BLE", "PIE"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is function calls in argument defaults.
"src/reviewer/cli.py" = ["B008"]
"evals/run_eval.py" = ["B008"]
# asserts are the point of a test.
# Tests shell out to `git` from PATH with fixed argument lists.
"tests/*" = ["S101", "S311", "S603", "S607"]
# `random` here is for reproducible corpus seeding, which is the opposite of a
# cryptographic requirement — the seed is the feature.
"evals/corpus.py" = ["S311"]
# The SQL mutator's entire job is to construct an injectable query.
"evals/mutations.py" = ["S608"]
# Invoking `git` from PATH with a fixed argument list.
"src/reviewer/adapters/local_git.py" = ["S603", "S607"]
